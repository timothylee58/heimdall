name: Backend and official checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: heimdall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heimdall_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HEIMDALL_TEST_POSTGRES_URL: postgresql://postgres:disposable-ci-only@localhost:5432/heimdall_test
    defaults:
      run:
        working-directory: heimdall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python official_checks.py --output ci-official-check-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-check-results
          path: heimdall/ci-official-check-results.json
          if-no-files-found: warn
